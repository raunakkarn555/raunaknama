[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # The yt-dlp binary is downloaded by scripts/download-ytdlp.mjs (this
  # project's own postinstall script — see that file for why we don't use
  # the ytdlp-nodejs package's own installer/runtime API) into
  # netlify/functions/_shared/bin/ at `npm install` time. esbuild only
  # bundles files it can see via require()/import, so without this, the
  # binary silently gets left out of the deployed function zip — the
  # function would then try to re-download it into the (read-only)
  # deployment folder at runtime and crash. This makes sure it ships with
  # the function.
  included_files = ["netlify/functions/_shared/bin/**"]

  # jsdom + bgutils-js (PO-token minting) are loaded with a dynamic import() at
  # runtime. Bundling jsdom makes esbuild warn about xhr-sync-worker.js, so they
  # are shipped as real node_modules instead of being bundled.
  external_node_modules = ["jsdom", "bgutils-js"]

# Netlify's synchronous function timeout defaults to 10s, and even on a paid
# Pro plan the hard platform max is 26s (Starter/free plans stay capped at
# 10s no matter what's set here). yt-dlp resolving a format from a
# throttled/shared cloud IP — especially for "Topic" channel / auto-generated
# official-audio uploads, which YouTube gates harder — can take longer than
# 10s even though it resolves fine locally with no such cap. Raising this
# gives those slower resolves a real chance to finish instead of Netlify
# hard-killing the function mid-request (which surfaces to the frontend as a
# generic/opaque failure instead of our own JSON error response).
[functions."stream"]
  timeout = 26

# Streams audio from googlevideo to the <audio> element (Range-aware).
[functions."audio-proxy"]
  timeout = 26

[functions."lyrics"]
  timeout = 26

[functions."search"]
  timeout = 26

[functions."artist-songs"]
  timeout = 26

[functions."music-search"]
  timeout = 26

[functions."playlist"]
  timeout = 26

# `netlify dev` runs this as a subprocess and proxies both the Vite dev
# server AND the Netlify Functions dev server behind one port (8888) so that
# /api/* resolves exactly like it does in production. Use `npm run dev`
# (which now runs `netlify dev`) and open http://localhost:8888 — NOT
# http://localhost:5173 directly, which has no functions behind it.
[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  publish = "dist"
  functionsPort = 9999
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

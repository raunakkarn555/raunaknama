  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.9"/>

  <g clip-path="url(#poleClip)">
    <rect x="21.5" y="21.5" width="21" height="21" fill="url(#pole)"/>
    <g stroke="#150a0d" stroke-width="5" opacity="0.18">
      <line x1="10" y1="50" x2="50" y2="10"/>
      <line x1="18" y1="58" x2="58" y2="18"/>
      <line x1="2" y1="42" x2="42" y2="2"/>
    </g>
  </g>
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#f4e8d8" stroke-width="1.4" opacity="0.5"/>

  <circle cx="49" cy="17" r="3.2" fill="#e2ab3f"/>

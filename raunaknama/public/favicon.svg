<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c1519"/>
      <stop offset="100%" stop-color="#150a0d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2ab3f"/>
      <stop offset="100%" stop-color="#b8333a"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8333a"/>
      <stop offset="33%" stop-color="#e2ab3f"/>
      <stop offset="66%" stop-color="#f4e8d8"/>
      <stop offset="100%" stop-color="#b8333a"/>
    </linearGradient>
    <clipPath id="poleClip">
      <circle cx="32" cy="32" r="10.5"/>
